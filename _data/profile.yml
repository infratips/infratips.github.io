name: "Eleu Carlos Roldão da S. Junior"
short_bio: "Profissional de tecnologia com experiência em GNU/Linux, Cloud, Infraestrutura como Código e Inteligência Artificial."
bio: >-
  Eleu Carlos Roldão da S. Junior é gaúcho e nasceu na Região Metropolitana de Porto Alegre.
  Trabalha com GNU/Linux desde 2001, possui diversas certificações e atua em projetos complexos
  de Cloud, Infraestrutura como Código (IaC) e Inteligência Artificial nos principais provedores globais.
disclaimer: >-
