---
layout: default
---
<article class="tag_index">
  <h1>{{ page.title }}</h1>
  <p class="archive_summary">{{ page.summary }}</p>
  {% assign sorted_tags = site.tags | sort %}
  {% for tag in sorted_tags %}
    {% assign tag_name = tag[0] %}
    <section id="{{ tag_name }}" class="tag_group" aria-labelledby="tag_{{ tag_name }}">
      <h2 id="tag_{{ tag_name }}">#{{ tag_name }}</h2>
      <ul>
        {% for post in tag[1] %}
        <li><a href="{{ post.url | relative_url }}">{{ post.title }}</a></li>
        {% endfor %}
      </ul>
    </section>
  {% endfor %}
</article>
